{% extends "base.html" %}

{% block title %}
Delete Enrollment
{% endblock %}

{% block content %}

<div class="container mt-4">

    <h2>Delete Enrollment</h2>

    <p>

        Are you sure you want to delete this enrollment?

    </p>

    <ul>

        <li><strong>Student:</strong> {{ enrollment.student }}</li>

        <li><strong>Section:</strong> {{ enrollment.section }}</li>

    </ul>

    <form method="post">

        {% csrf_token %}

        <button class="btn btn-danger">

            Delete

        </button>

        <a
            href="{% url 'enrollments:enrollment_list' %}"
            class="btn btn-secondary">

            Cancel

        </a>

    </form>

</div>

{% endblock %}
