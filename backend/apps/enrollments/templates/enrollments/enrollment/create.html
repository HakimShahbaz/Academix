{% extends "base.html" %}

{% block title %}
Create Enrollment
{% endblock %}

{% block content %}

<div class="container mt-4">

    <h2>Create Enrollment</h2>

    <form method="post">

        {% csrf_token %}

        {{ form.as_p }}

        <button class="btn btn-primary">

            Save

        </button>

        <a
            href="{% url 'enrollments:enrollment_list' %}"
            class="btn btn-secondary">

            Cancel

        </a>

    </form>

</div>

{% endblock %}
