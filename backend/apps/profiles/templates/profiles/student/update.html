{% extends "base.html" %}

{% block title %}
Update Student
{% endblock %}

{% block content %}

<div class="container mt-4">

    <h2>Update Student</h2>

    <form method="post">

        {% csrf_token %}

        {{ form.as_p }}

        <div class="mt-3">

            <button type="submit" class="btn btn-primary">
                Update
            </button>

            <a href="{% url 'profiles:student_list' %}" class="btn btn-secondary">
                Cancel
            </a>

        </div>

    </form>

</div>

{% endblock %}
