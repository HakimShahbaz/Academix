{% extends "base.html" %}

{% block title %}
Delete Teacher
{% endblock %}

{% block content %}

<div class="container mt-4">

    <h2>Delete Teacher</h2>

    <p>

        Are you sure you want to delete

        <strong>{{ object.teacher_number }}</strong>?

    </p>

    <form method="post">

        {% csrf_token %}

        <button type="submit" class="btn btn-danger">
            Delete
        </button>

        <a href="{% url 'profiles:teacher_list' %}" class="btn btn-secondary">
            Cancel
        </a>

    </form>

</div>

{% endblock %}
