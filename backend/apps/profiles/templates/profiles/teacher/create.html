{% extends "base.html" %}

{% block title %}
Create Teacher
{% endblock %}

{% block content %}

<div class="container mt-4">

    <h2>Create Teacher</h2>

    <form method="post">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn btn-primary">
            Save
        </button>

        <a href="{% url 'profiles:teacher_list' %}" class="btn btn-secondary">
            Cancel
        </a>

    </form>

</div>

{% endblock %}
