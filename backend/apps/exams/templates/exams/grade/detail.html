{% extends "base.html" %}

{% block title %}
Grade Details
{% endblock %}

{% block content %}

<div class="container mt-4">

    <h2>Grade Details</h2>

    <table class="table table-bordered">

        <tr>
            <th>Student</th>
            <td>{{ grade.enrollment.student }}</td>
        </tr>

        <tr>
            <th>Section</th>
            <td>{{ grade.enrollment.section }}</td>
        </tr>

        <tr>
            <th>Exam</th>
            <td>{{ grade.exam.title }}</td>
        </tr>

        <tr>
            <th>Score</th>
            <td>{{ grade.score }}</td>
        </tr>

    </table>

    <a href="{% url 'exams:grade_update' grade.pk %}"
       class="btn btn-warning">

        Edit

    </a>

    <a href="{% url 'exams:grade_delete' grade.pk %}"
       class="btn btn-danger">

        Delete

    </a>

    <a href="{% url 'exams:grade_list' %}"
       class="btn btn-secondary">

        Back

    </a>

</div>

{% endblock %}
