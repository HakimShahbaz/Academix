{% extends "base.html" %}

{% block title %}
Delete Exam
{% endblock %}

{% block content %}

<div class="container mt-4">

    <h2>Delete Exam</h2>

    <p>

        Are you sure you want to delete this exam?

    </p>

    <ul>

        <li><strong>Title:</strong> {{ exam.title }}</li>

        <li><strong>Section:</strong> {{ exam.section }}</li>

        <li><strong>Exam Date:</strong> {{ exam.exam_date }}</li>

    </ul>

    <form method="post">

        {% csrf_token %}

        <button class="btn btn-danger">

            Delete

        </button>

        <a
            href="{% url 'exams:exam_list' %}"
            class="btn btn-secondary">

            Cancel

        </a>

    </form>

</div>

{% endblock %}
